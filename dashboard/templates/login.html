{% extends "base.html" %}
{% block title %}Sign in · JusticeFlow{% endblock %}
{% block content %}
<section class="card login">
    <h1>Sign in</h1>
    {% with messages = get_flashed_messages() %}{% for m in messages %}<div class="banner">{{ m }}</div>{% endfor %}{% endwith %}
    {% if error %}<div class="banner error" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
        <label>CNIC <input name="cnic" placeholder="42101-1234567-1" autocomplete="username" required autofocus></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
    </form>
</section>
{% endblock %}
